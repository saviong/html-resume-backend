# The API is deployed by the frontend repo's Deploy to Azure Static Web Apps
# workflow, which checks this repo out into api/. The old Function App
# (resumevisitor-fn) has been decommissioned, so there is nothing to deploy
# from here -- this workflow just guards the code with the unit tests.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python_version'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest test -v
