name: Build and deploy Python project to Azure Function App - resumevisitor-fn

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python_version'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Test with unittest
        run: python -m unittest test -v

      - name: Deploy to Azure Functions
        id: deploy-to-webapp
        uses: Azure/functions-action@v1
        with:
          app-name: 'resumevisitor-fn'
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E36E98A6015F480EA3745B2541890F8C }}
